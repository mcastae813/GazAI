name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug --no-daemon
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "GazAI-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "GazAI-${GITHUB_REF_NAME}.apk" \
            --title "GazAI ${GITHUB_REF_NAME}" \
            --notes "First release. Install the APK (debug-signed), add a free OpenRouter key in Settings, then add your car and motorcycle."

name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to create (e.g. v0.1.0)
        default: v0.1.0
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug --no-daemon
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.version || github.ref_name }}"
          cp app/build/outputs/apk/debug/app-debug.apk "GazAI-${TAG}.apk"
          gh release create "$TAG" "GazAI-${TAG}.apk" --target "$GITHUB_SHA" \
            --title "GazAI ${TAG}" \
            --notes "First release. Install the APK (debug-signed), add a free OpenRouter key in Settings, then add your car and motorcycle."

name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to create (e.g. v0.3.0); must have a section in CHANGELOG.md
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Passed through the environment, never pasted into scripts, so the input can't inject shell code.
      TAG: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, to compare versionCode with the previous release
      - name: Check version
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The version must look like v1.2.3 (got '$TAG')."
            exit 1
          fi
          VER="${TAG#v}"
          NAME=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          CODE=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts)
          if [ "$NAME" != "$VER" ]; then
            echo "::error::app/build.gradle.kts has versionName \"$NAME\", but this release is $VER. Update versionName and versionCode first."
            exit 1
          fi
          PREV=$(git tag --list 'v*' --sort=-v:refname | { grep -vx "$TAG" || true; } | head -1)
          if [ -n "$PREV" ]; then
            PREV_CODE=$( (git show "$PREV:app/build.gradle.kts" 2>/dev/null || true) | sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p')
            if [ -n "$PREV_CODE" ] && [ "$CODE" -le "$PREV_CODE" ]; then
              echo "::error::versionCode is $CODE, but $PREV already used $PREV_CODE. Raise it, or phones won't treat this release as an update."
              exit 1
            fi
          fi
          echo "VER=$VER" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Load signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$SIGNING_PASSWORD" ]; then
            echo "::error::Add the SIGNING_KEYSTORE_B64 and SIGNING_PASSWORD repository secrets (see README). Releases must use the same key every time or updates fail to install."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Test and build signed APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease --no-daemon
      - name: Verify signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee signature.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v ver="$VER" '/^## /{p = ($2 == ver)} p' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "::error::No '## $VER' section in CHANGELOG.md"; exit 1; fi
          cp app/build/outputs/apk/release/app-release.apk "GazAI-${TAG}.apk"
          gh release create "$TAG" "GazAI-${TAG}.apk" --target "$GITHUB_SHA" --title "GazAI ${TAG}" --notes-file notes.md
